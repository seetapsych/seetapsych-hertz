[project]
name = "seetapsych-hertz"
description = "Heart rate estimation modules for SeetaPsych"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { file = "LICENSE" }
dependencies = [
    "seetapsych-lib>=0.0.3",
]

[project.urls]
Homepage = "https://github.com/seetapsych/seetapsych-hertz"
Repository = "https://github.com/seetapsych/seetapsych-hertz"
Issues = "https://github.com/seetapsych/seetapsych-hertz/issues"

[project.optional-dependencies]
all = [
    "numpy>=2.2.6",
    "opencv-python>=4.13",
    "scipy>=1.15.3",
    "onnx>=1.20.1",
    "onnxruntime>=1.24; sys_platform == 'darwin' and python_version > '3.10'",
    "onnxruntime<1.24; sys_platform == 'darwin' and python_version <= '3.10'",
    "onnxruntime-gpu>=1.24; sys_platform != 'darwin' and python_version > '3.10'",
    "onnxruntime-gpu<1.24; sys_platform != 'darwin' and python_version <= '3.10'",
]
dev = [
    "seetapsych-hertz[all]",
    # build tools
    "build>=1.4.4",
    "twine>=6.2.0",
    # test tools
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
]

[dependency-groups]
dev = [
    "seetapsych-hertz[dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    "seetapsych_hertz/_version.py",
    # third-party vendored code
    "seetapsych_hertz/ada_chrom/lib",
    "seetapsych_hertz/tinyhr/lib",
]

[tool.ruff.lint]
select = [
    "E",  # PEP 8 syntax / style errors (pycodestyle)
    "F",  # Undefined names, unused imports, logical errors (Pyflakes)
    "B",  # Common logic pitfalls (flake8-bugbear: mutable defaults, bare except, etc.)
    "I",  # Import ordering and grouping (isort)
    "ANN001",  # Missing type annotation for function argument (flake8-annotations)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
plugins = []
# Recommended checks (not covered by strict=false)
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["annotation-unchecked"]
exclude = [
    "seetapsych_hertz/_version.py",
    "tests/",
    # third-party vendored code
    "seetapsych_hertz/ada_chrom/lib",
    "seetapsych_hertz/tinyhr/lib",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "dist",
    "build",
    # third-party vendored code
    "seetapsych_hertz/ada_chrom/lib",
    "seetapsych_hertz/tinyhr/lib",
]
# ML-ecosystem standard usage skips:
skips = [
    "B101", # assert used routinely for pre/post-condition checks in research code
    "B301", # pickle.load for pre-trained local model deserialization
    "B311", # random.* for deterministic data augmentation seeds
    "B403", # import pickle (paired with B301)
    "B614", # torch.load for transfer-learning weight loading
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
tag-pattern = "^r(?P<version>[^-]+)$"

[tool.hatch.build.hooks.vcs]
version-file = "seetapsych_hertz/_version.py"

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seetapsych_hertz"]

[tool.hatch.build.targets.wheel.package-data]
seetapsych_hertz = ["modules/**/*.yml"]

[tool.uv.sources]
# seetapsych-lib = { workspace = true }
