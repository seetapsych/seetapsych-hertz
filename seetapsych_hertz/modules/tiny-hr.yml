version: '1.0'
module:
  uid: 0faf2236-2f76-44c0-be75-ad95fc5f5322
  name: TinyHR
  version: '1.0'
  description: 'Lightweight neural network for fast heart rate estimation directly from face video frames.'
  keywords:
    - Heart Rate
    - rPPG
  requirements:
    - seetapsych-hertz
    - numpy>=2.2.6
    - opencv-python>=4.13
    - scipy>=1.15.3
    - onnx>=1.20.1
    - onnxruntime>=1.24; sys_platform == 'darwin' and python_version > '3.10'
    - onnxruntime<1.24; sys_platform == 'darwin' and python_version <= '3.10'
    - onnxruntime-gpu>=1.24; sys_platform != 'darwin' and python_version > '3.10'
    - onnxruntime-gpu<1.24; sys_platform != 'darwin' and python_version <= '3.10'
packages:
  - uid: 23871da8-0968-4034-ac48-35641ae67d63
    name: HeartRate-TinyHR
    description: Fast RhythmFormer heart rate estimator using buffered face crops plus Welch spectral analysis
    version: '1.0'
    usage_models: []
    inputs: []
    provides:
      - face/heart_rate
    requires:
      - face/detection
    entry:
      method: seetapsych_hertz.tinyhr.package.load
    parameters:
      - name: fps
        text: FPS
        description: Expected camera/video FPS used for spectral analysis windowing. Mismatch with actual source FPS degrades HR accuracy.
        type: number
        value: 30
      - name: interval
        text: Interval
        description: Seconds between consecutive HR estimates. Smaller intervals yield more updates with higher jitter; larger intervals are smoother but slower.
        type: number
        value: 1
    models:
      - uid: c745a157-cb59-4fb7-bce6-97b38ad416ab
        name: seeta-hertz-tinyhr.onnx
        version: '1.0'
        recommended: true
        download:
          index: seeta-hertz-tinyhr.onnx
          sha256: a165d0a628048f25afb9b13c1cac10cc84137127dd68a0efa7aff2d8d5ef7e91
          url: https://www.modelscope.cn/models/seetapsych/seetapsych-models/resolve/master/seetapsych/hertz/seeta-hertz-tinyhr.onnx
