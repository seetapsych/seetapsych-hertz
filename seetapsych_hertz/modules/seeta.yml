version: '1.0'
module:
  uid: 4b49524d-00cd-4a14-988c-a35ad51bf157
  name: SeetaHeartRateDetector
  version: 0.0.1
  description: 'Estimate heart rate from camera/video continuous frames.'
  keywords:
    - Face
    - Selection
  requirements:
    - seetapsych-hertz
    - numpy>=2.2.6
    - opencv-python>=4.13
    - scipy>=1.15.3
packages:
  - uid: 08e29e70-e21b-4ef2-8486-5aaec5f8295b
    name: SeetaHeartRateDetector
    version: 0.0.1
    usage_models: []
    inputs: []
    provides:
      - face/heart_rate
    requires:
      - face/dense_landmarks
    entry:
      method: seetapsych_hertz.seeta.package.load
    parameters:
      - name: min_seconds
        text: Min Seconds
        description: Min seconds to start heart rate estimation
        type: number
        value: 1
      - name: min_frames
        text: Min Frames
        description: Min frames to start heart rate estimation
        type: integer
        value: 10
      - name: max_frames
        text: Max Frames
        description: Max frames to keep in algorithm to estimate heart rate
        type: integer
        value: 300
    models: []
